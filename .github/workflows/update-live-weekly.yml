name: Update live weekly data

on:
  workflow_dispatch:
  schedule:
    # Atualizacao operacional a cada 30 minutos, evitando minutos congestionados do agendador do GitHub.
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: update-live-weekly
  cancel-in-progress: false

jobs:
  update-live-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository state
        run: |
          git fetch origin main
          git pull --rebase origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Refresh ITF official ranking base
        run: npm run scrape:ranking
        env:
          RANKING_LIMIT: "1000"

      - name: Scrape weekly tournament results
        run: npm run scrape:weekly

      - name: Generate latest data
        run: npm run build:data

      - name: Validate latest data
        run: npm run validate:data

      - name: Commit live weekly data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/sources/players.json data/itf-ranking-preview.json data/latest.json data/weekly-results.csv data/weekly-tournaments-preview.json data/weekly-outsiders.csv data/weekly-outsiders-preview.json
          git diff --cached --quiet && exit 0
          git commit -m "Update live weekly data"
          git pull --rebase origin main
          git push

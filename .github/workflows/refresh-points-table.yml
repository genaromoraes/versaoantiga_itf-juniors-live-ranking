name: Refresh points table

on:
  workflow_dispatch:
    inputs:
      ranking_limit:
        description: "Quantidade por categoria (Boys e Girls)"
        required: true
        default: "30"
        type: choice
        options:
          - "20"
          - "30"
          - "50"
          - "100"

permissions:
  contents: write

concurrency:
  group: refresh-points-table
  cancel-in-progress: false

jobs:
  refresh-points:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RANKING_LIMIT: ${{ inputs.ranking_limit || '30' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository state
        run: |
          git fetch origin main
          git pull --rebase origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Scrape ITF ranking sources
        run: npm run scrape:ranking

      - name: Scrape ITF points breakdowns
        run: npm run scrape:player

      - name: Rebuild points CSV
        run: npm run build:points-csv

      - name: Audit points table
        run: npm run audit:points

      - name: Scrape weekly results
        run: npm run scrape:weekly

      - name: Generate latest data
        run: npm run build:data

      - name: Validate latest data
        run: npm run validate:data

      - name: Commit refreshed points table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/sources/players.json data/itf-ranking-preview.json data/itf-player-preview.json data/player-points.csv data/player-points-status.csv data/weekly-results.csv data/weekly-tournaments-preview.json data/latest.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Top ${RANKING_LIMIT} junior points table"
          git pull --rebase origin main
          git push

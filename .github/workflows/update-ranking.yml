name: Update ranking data

on:
  workflow_dispatch:
  schedule:
    # Workflow completo, poucas vezes por dia.
    - cron: "0 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: update-ranking-full
  cancel-in-progress: false

jobs:
  update-ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync latest repository state
        run: |
          git fetch origin main
          git pull --rebase origin main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Scrape ITF official ranking
        run: npm run scrape:ranking
        env:
          RANKING_LIMIT: "1000"

      - name: Scrape weekly tournament results
        run: npm run scrape:weekly

      - name: Generate latest data
        run: npm run build:data

      - name: Audit player points table
        run: npm run audit:points

      - name: Validate latest data
        run: npm run validate:data

      - name: Commit latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pipeline/sources/players.json data/latest.json data/itf-ranking-preview.json data/weekly-results.csv data/weekly-tournaments-preview.json data/weekly-outsiders.csv data/weekly-outsiders-preview.json data/manual-weekly-results.csv data/player-points-status.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update ranking data"
          git pull --rebase origin main
          git push
